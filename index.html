*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,select,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0c0f13;position:sticky;top:0;z-index:20}.brand{font-weight:800;letter-spacing:-.02em}.brand span{color:var(--accent)}.developer{font-size:13px;color:var(--muted)}.screen{max-width:1440px;margin:0 auto;padding:32px 24px}.hero{max-width:760px;margin:7vh auto 0}.eyebrow{font-size:12px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.12em}.hero h1{font-size:clamp(38px,6vw,64px);line-height:1;margin:10px 0}.hero p{color:var(--muted);font-size:18px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.stat{border:1px solid var(--border);background:var(--panel);padding:14px 18px;border-radius:12px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.setup{margin-top:30px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px}.section-title{font-size:12px;text-transform:uppercase;color:var(--muted);font-weight:800;letter-spacing:.1em;margin-bottom:12px}.mode-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mode-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:10px;text-align:left}.mode-btn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.mode-btn small{display:block;color:var(--muted);margin-top:5px}.config{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{border:1px solid var(--border);border-radius:10px;padding:14px;background:#0e1216}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.field select,.field input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px}.toggle{display:flex;gap:10px;align-items:center}.toggle input{accent-color:var(--accent)}.primary{margin-top:18px;width:100%;border:0;background:var(--accent);color:#07101f;padding:13px 18px;border-radius:10px;font-weight:800}.hint{font-size:12px;color:var(--muted);margin-top:8px}.quiz-shell{height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}.quiz-shell.sidebar-collapsed{grid-template-columns:minmax(0,1fr) 48px}.main{min-width:0;overflow:auto}.quiz-header{height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:rgba(11,13,16,.96);z-index:5}.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:24px}.timer.warn{color:var(--amber)}.timer.danger{color:var(--red)}.quiz-body{max-width:950px;margin:0 auto;padding:32px 28px 60px}.q-meta{color:var(--muted);font-size:13px;margin-bottom:12px}.q-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:28px}.q-text{font-size:21px;line-height:1.55;white-space:pre-wrap}.code-wrap{margin:20px 0;border:1px solid #303944;border-radius:10px;overflow:hidden;background:#0a0d11}.code-head{height:36px;background:#12171d;border-bottom:1px solid #29323d;display:flex;align-items:center;padding:0 12px;gap:6px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#3a424d}.code{padding:18px;overflow:auto;font:14px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;color:#e6edf3}.kw{color:#ff7ab2}.type{color:#6ecbff}.str{color:#a8e28b}.num{color:#d6b6ff}.com{color:#73808e}.meth{color:#ffd479}.options{display:grid;gap:10px;margin-top:22px}.option{width:100%;text-align:left;border:1px solid var(--border);background:#10151a;color:var(--text);padding:15px 16px;border-radius:10px;display:flex;gap:13px;align-items:flex-start}.option:hover{border-color:#4b5a6b;background:#151b22}.option.selected{border-color:var(--accent);background:#101a2b}.letter{width:28px;height:28px;border-radius:50%;border:1px solid #46515d;display:grid;place-items:center;flex:0 0 auto;color:var(--muted);font-weight:800;font-size:12px}.option.selected .letter{background:var(--accent);color:#07101f;border-color:var(--accent)}.review{margin-top:18px;border:1px solid var(--border);background:#10151a;color:var(--muted);padding:11px 14px;border-radius:9px}.review.marked{color:#ffd37a;border-color:#6a5120;background:#1a150b}.instant{margin-top:18px;padding:16px;border-radius:10px;border:1px solid var(--border)}.instant.correct{border-color:#245f45;background:#0c1c15}.instant.wrong{border-color:#6b2b36;background:#1d0e12}.instant strong{display:block;margin-bottom:6px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.nav button{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:12px 16px;border-radius:9px}.nav button:disabled{opacity:.35;cursor:not-allowed}.sidebar{border-left:1px solid var(--border);background:#0f1318;min-width:0;overflow:hidden}.sidebar.collapsed{display:flex;align-items:flex-start;justify-content:center;padding-top:14px}.collapse-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);width:34px;height:34px;border-radius:8px}.side-inner{padding:18px;overflow:auto;height:100%}.side-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.side-title b{font-size:14px}.counts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.count{border:1px solid var(--border);border-radius:9px;padding:9px;background:var(--panel);font-size:11px;color:var(--muted)}.count b{display:block;color:var(--text);font-size:15px}.legend{display:grid;gap:7px;margin-bottom:16px}.legend div{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot-state{width:9px;height:9px;border-radius:3px;border:1px solid #47515d}.s-visited{background:#183554;border-color:#3774ad}.s-attempted{background:#123d2a;border-color:#2c9a68}.s-marked{background:#4b3610;border-color:#d39c32}.s-both{background:#342050;border-color:#9c6be3}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.qn{border:1px solid var(--border);background:#11161c;color:var(--muted);aspect-ratio:1;border-radius:8px;font-size:12px}.qn.current{outline:2px solid var(--accent);color:var(--text)}.qn.visited{background:#183554;color:#bfe0ff}.qn.attempted{background:#123d2a;color:#c5f7df}.qn.marked{background:#4b3610;color:#ffe0a0}.qn.both{background:#342050;color:#e7d7ff}.result{max-width:1000px;margin:0 auto;padding:40px 24px}.scorebox{display:flex;align-items:end;gap:18px;margin:25px 0}.bigscore{font-size:64px;font-weight:900}.percent{color:var(--muted);font-size:20px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.result-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}.result-card span{display:block;color:var(--muted);font-size:12px}.result-card b{font-size:25px}.wrong-list{margin-top:28px;display:grid;gap:14px}.wrong-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px}.wrong-card h3{margin:0 0 10px}.wrong-card .small{font-size:13px;color:var(--muted);margin:6px 0}.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.secondary{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:12px 16px;border-radius:9px}.focus{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:1000px){.mode-grid{grid-template-columns:repeat(2,1fr)}.config{grid-template-columns:1fr}.quiz-shell{grid-template-columns:1fr}.sidebar{position:fixed;right:0;top:64px;bottom:0;width:min(340px,92vw);z-index:15;box-shadow:-20px 0 50px #0008}.sidebar.collapsed{display:none}.quiz-shell.sidebar-collapsed{grid-template-columns:1fr}.quiz-header{padding:0 18px}.quiz-body{padding:22px 16px 50px}}@media(max-width:560px){.topbar{padding:0 14px}.developer{display:none}.screen{padding:22px 14px}.hero{margin-top:4vh}.stats{gap:8px}.stat{padding:11px 13px}.mode-grid{grid-template-columns:1fr}.q-card{padding:18px}.q-text{font-size:18px}.result-grid{grid-template-columns:1fr}.bigscore{font-size:48px}}

const QUESTIONS = [{"assignment": 1, "number": 1, "question": "Consider the following program.", "options": {"A": "Hello, World!", "B": "HelloWorld!", "C": "Compilation Error", "D": "Runtime Error"}, "answer": "A", "code": "class NPTEL {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, World!\");\n    }\n}", "explanation": "This is the standard syntax for a Java program to print the string \"Hello, World!\" to the console.", "imageData": ""}, {"assignment": 1, "number": 2, "question": "A Java file with extension ‘.class’ contains:", "options": {"A": "Java source code", "B": "HTML tags", "C": "Java Byte code", "D": "A program file written in Java programming language"}, "answer": "C", "code": "", "explanation": "A .class file is a compiled version of the .java file in byte code.", "imageData": ""}, {"assignment": 1, "number": 3, "question": "Which of the following is NOT an object-oriented programming paradigm?", "options": {"A": "Encapsulation", "B": "Inheritance", "C": "Polymorphism", "D": "Dynamic memory allocation"}, "answer": "D", "code": "", "explanation": "Encapsulation, Inheritance, and Polymorphism are core paradigms. Dynamic memory allocation is a memory allocation strategy and not a programming paradigm.", "imageData": ""}, {"assignment": 1, "number": 4, "question": "What is the correct sequence of steps to execute a Java program?", "options": {"A": "Run → Edit → Compile", "B": "Edit → Run → Compile", "C": "Compile → Edit → Run", "D": "Edit → Compile → Run"}, "answer": "D", "code": "", "explanation": "The Java development process involves writing code (Edit), converting it to bytecode (Compile), and then executing it on the JVM (Run).", "imageData": ""}, {"assignment": 1, "number": 5, "question": "Which program is used to compile Java source code into bytecode?", "options": {"A": "javap", "B": "javac", "C": "java", "D": "javad"}, "answer": "B", "code": "", "explanation": "The JDK includes a tool called ‘javac’ that compiles Java source code to Java bytecode.", "imageData": ""}, {"assignment": 1, "number": 6, "question": "In Java, what is the role of the public static void main(String[] args) method?", "options": {"A": "Initialization method", "B": "Execution entry point", "C": "Constructor", "D": "Destructor"}, "answer": "B", "code": "", "explanation": "The public static void main(String[] args) method is the entry point for the execution of a Java program.", "imageData": ""}, {"assignment": 1, "number": 7, "question": "Which of the following is not a feature of Java?", "options": {"A": "Platform Independence", "B": "Object-Oriented Programming", "C": "Supports Explicit Pointers", "D": "Supports Polymorphism"}, "answer": "C", "code": "", "explanation": "Java is platform-independent, object-oriented, and secure. It does not support explicit pointers.", "imageData": ""}, {"assignment": 1, "number": 8, "question": "What is the primary purpose of the Java Virtual Machine (JVM) in the Java programming language?", "options": {"A": "Graphical User Interface", "B": "Platform independence", "C": "Code Debugging", "D": "Game Engine"}, "answer": "B", "code": "", "explanation": "The JVM enables platform independence by interpreting Java bytecode, allowing Java programs to run on any device with a compatible JVM.", "imageData": ""}, {"assignment": 1, "number": 9, "question": "Consider the following program. What is the output of the above code?", "options": {"A": "50", "B": "10", "C": "0", "D": "5"}, "answer": "A", "code": "public class Question {\n    public static void main(String[] args) {\n        int x = 5;\n        x *= (2 + 8);\n        System.out.println(x);\n    }\n}", "explanation": "x *= (2 + 8) is equivalent to x = x * (2 + 8), so x becomes 50.", "imageData": ""}, {"assignment": 1, "number": 10, "question": "Which of the following is true regarding how Java handles code execution?", "options": {"A": "Java uses only interpreter.", "B": "Java uses only compiler.", "C": "Java uses both interpreter and compiler.", "D": "None of the above."}, "answer": "C", "code": "", "explanation": "Creating a .class file using javac is compilation, while execution of a .class file using java is interpretation.", "imageData": ""}, {"assignment": 2, "number": 1, "question": "What is the correct signature of the main method in Java?", "options": {"A": "public static void main(String[] args)", "B": "public void main(String args[])", "C": "void main(String[] args)", "D": "public static void main(Sting [])"}, "answer": "A", "code": "", "explanation": "The main method in Java must be declared as public static void main(String[] args) to be recognized by the JVM as the entry point of the program.", "imageData": ""}, {"assignment": 2, "number": 2, "question": "Consider the code given below. What will be the output of the above Java program?", "options": {"A": "30 99 178", "B": "30 88 129", "C": "30 99 187", "D": "99 99 187"}, "answer": "C", "code": "class VarPrint {\n    int x = 30;\n    static int y = 20;\n    public static void main(String[] args) {\n        VarPrint t1 = new VarPrint();\n        t1.x = 88;\n        t1.y = 99;\n        int z1 = t1.x + t1.y;\n        VarPrint t2 = new VarPrint();\n        System.out.println(t2.x + \" \" + t2.y + \" \" + z1);\n    }\n}", "explanation": "Instance variables have a separate copy for each object, while a static variable has a single copy shared by all objects.", "imageData": ""}, {"assignment": 2, "number": 3, "question": "Consider the code given below. What will be the output of the code given above?", "options": {"A": "839 45foo45 9foo", "B": "9 7 7 foo34 34foo", "C": "72 34 34 foo34 34foo", "D": "839 45foo45 9foo9"}, "answer": "A", "code": "public class ArgumenTest {\n    public static void main(String[] args) {\n        Test t = new Test();\n        t.start();\n    }\n    static class Test {\n        void start() {\n            int a = 4;\n            int b = 5;\n            System.out.print(\"\" + 8 + 3 + \"\");\n            System.out.print(a + b);\n            System.out.print(\" \" + a + b + \"\");\n            System.out.print(foo() + a + b + \" \");\n            System.out.println(a + b + foo());\n        }\n        String foo() { return \"foo\"; }\n    }\n}", "explanation": "print() converts values to String representations and + performs concatenation when a String is involved.", "imageData": ""}, {"assignment": 2, "number": 4, "question": "Which keyword is used in Java to refer to the current object?", "options": {"A": "this", "B": "that", "C": "self", "D": "current"}, "answer": "A", "code": "", "explanation": "The this keyword refers to the current object within an instance method or constructor.", "imageData": ""}, {"assignment": 2, "number": 5, "question": "Which of the following is true about constructors in a class?", "options": {"A": "Constructors do not have a return type.", "B": "Constructors aren’t used to initialize objects.", "C": "A class can have only one constructor.", "D": "Constructors cannot be overloaded."}, "answer": "A", "code": "", "explanation": "Constructors have the same name as the class, no return type, and can be overloaded.", "imageData": ""}, {"assignment": 2, "number": 6, "question": "Consider the following code snippet. What will be the output of the code given above?", "options": {"A": "0", "B": "10", "C": "100", "D": "Runtime error"}, "answer": "A", "code": "class NPTEL_W2 {\n    int x;\n    NPTEL_W2(int x) { this.x = x; }\n    void printX() { System.out.println(this.x); }\n    public static void main(String[] args) {\n        NPTEL_W2 obj = new NPTEL_W2(000);\n        obj.printX();\n    }\n}", "explanation": "The value passed to the constructor is 000, which is zero.", "imageData": ""}, {"assignment": 2, "number": 7, "question": "(\\n in output is to be assumed to be the new line character) What will be the output of the code given above?", "options": {"A": "Hello World\\nNumber: 10", "B": "Hello WorldNumber: 10", "C": "Hello\\nWorld\\nNumber: 10", "D": "Hello World\\nNumber: 10\\n"}, "answer": "C", "code": "public class Main {\n    public static void main(String[] args) {\n        System.out.println(\"Hello\");\n        System.out.println(\"World\");\n        System.out.printf(\"Number: %d\", 10);\n    }\n}", "explanation": "println prints a newline; printf prints formatted text without adding a newline here.", "imageData": ""}, {"assignment": 2, "number": 8, "question": "Which class is used in Java to take runtime data input from the user?", "options": {"A": "BufferReader", "B": "UserInputStreamReader", "C": "Scanner", "D": "DataInputStreamReader"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 2, "number": 9, "question": "How do you read a line of text from the console using the Scanner class in Java?", "options": {"A": "scanner.readLine()", "B": "scanner.nextLine()", "C": "scanner.getLine()", "D": "scanner.fetchLine()"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 2, "number": 10, "question": "Which of the following is the correct way to declare a class in Java?", "options": {"A": "public class MyClass {}", "B": "class MyClass[] {}", "C": "public MyClass class {}", "D": "MyClass public class {}"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 3, "number": 1, "question": "Which of the following statements is true regarding the order of execution of constructors in an inheritance hierarchy?", "options": {"A": "Derived class constructor will be called followed by the base class constructor.", "B": "Only Base class constructor will be called.", "C": "Only derived class constructor will be called.", "D": "Base class constructor will be called followed by the derived class constructor."}, "answer": "D", "code": "", "explanation": "On object creation of a derived class, the base class constructor executes first, then the derived class constructor.", "imageData": ""}, {"assignment": 3, "number": 2, "question": "The super() method is used to:", "options": {"A": "Call constructor of friend class", "B": "Call constructor of the parent class", "C": "Call constructor", "D": "Is a declared method"}, "answer": "B", "code": "", "explanation": "super() invokes the constructor of the immediate parent class.", "imageData": ""}, {"assignment": 3, "number": 3, "question": "What is the output of the following Java program?", "options": {"A": "\"The vehicle moves\"", "B": "\"The car moves\"", "C": "The code does not compile", "D": "None of the above"}, "answer": "B", "code": "class Vehicle {\n    public void move() { System.out.println(\"The vehicle moves\"); }\n}\nclass Car extends Vehicle {\n    public void move() { System.out.println(\"The car moves\"); }\n}\npublic class Main {\n    public static void main(String[] args) {\n        Vehicle vehicle = new Car();\n        vehicle.move();\n    }\n}", "explanation": "Method overriding uses the runtime type of the object, so Car.move() executes.", "imageData": ""}, {"assignment": 3, "number": 4, "question": "Which of the following is NOT true regarding the final keyword in Java?", "options": {"A": "A final method cannot be overridden in a subclass.", "B": "A final variable can only be assigned once.", "C": "A final class can have subclasses.", "D": "A final variable can be assigned during declaration or in the constructor."}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 3, "number": 5, "question": "Which type of inheritance leads to the \"Diamond Problem\"?", "options": {"A": "Single level", "B": "Multi-level", "C": "Multiple", "D": "Hierarchical"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 3, "number": 6, "question": "Members of a class which are not intended to be inherited by subclasses should be declared as:", "options": {"A": "Public members", "B": "Protected members", "C": "Private members", "D": "Private or Protected members"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 3, "number": 7, "question": "In Java, is it possible to override a static method?", "options": {"A": "Yes, we can override a static method just like we do with instance methods.", "B": "No, static methods cannot be overridden because they belong to the class, not the object.", "C": "It depends on whether the static method is declared as final or not.", "D": "It depends on the access modifier of the static method."}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 3, "number": 8, "question": "What is the output of the following Java program?", "options": {"A": "5", "B": "24", "C": "120", "D": "Runtime Error"}, "answer": "C", "code": "public class NptelExample {\n    public static int fun(int n) {\n        if (n == 0) return 1;\n        return n * fun(n - 1);\n    }\n    public static void main(String[] args) {\n        System.out.println(fun(5));\n    }\n}", "explanation": "The recursive method calculates factorial: 5 × 4 × 3 × 2 × 1 = 120.", "imageData": ""}, {"assignment": 3, "number": 9, "question": "Which of the following statements about abstract classes in Java is correct?", "options": {"A": "Abstract classes can be instantiated directly.", "B": "An abstract class must contain at least one abstract method.", "C": "A class inheriting from an abstract class must implement all its abstract methods unless it is itself abstract.", "D": "Abstract classes can be marked as final."}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 3, "number": 10, "question": "What will be the output of the below program?", "options": {"A": "value of a = 20", "B": "error: cannot assign a value to final variable a", "C": "error: unknown variable 'a' in class subDemoClass", "D": "value of a = 40"}, "answer": "B", "code": "class superDemoClass { final int a = 20; }\nclass subDemoClass extends superDemoClass {\n    void subFunc() { a = 40; System.out.println(\"value of a = \" + a); }\n}\nclass demo { public static void main(String[] args) { new subDemoClass().subFunc(); } }", "explanation": "The inherited final variable cannot be reassigned, causing a compilation error.", "imageData": ""}, {"assignment": 4, "number": 1, "question": "What is the process by which we can control what parts of a program can access the members of a class?", "options": {"A": "Polymorphism", "B": "Augmentation", "C": "Encapsulation", "D": "Recursion"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 4, "number": 2, "question": "Consider the program given below. What will be the output if the program is executed?", "options": {"A": "It will give compile-time error", "B": "It will give run-time error", "C": "1.0", "D": "3.14"}, "answer": "A", "code": "public class Main {\n    public static void main(String args[]){\n        System.out.println(cos(2*PI));\n    }\n}", "explanation": "The Math class members PI and cos are not imported statically, so the program gives a compile-time error.", "imageData": ""}, {"assignment": 4, "number": 3, "question": "Consider the following code: What will be the output of the code given above?", "options": {"A": "1Java11Java0", "B": "1Java10Java0", "C": "10Java0Java", "D": "0Java11Java0"}, "answer": "A", "code": "class Person { int a=1; int b=1; public Person(){ System.out.print(a*b+\"Java\"+a); } }\nclass Employee extends Person { int a=0; int b=1; public Employee(){ System.out.print(a+b+\"Java\"+a); } }\npublic class Question { public static void main(String args[]){ Person p=new Employee(); } }", "explanation": "The superclass constructor runs first via implicit super(), then the subclass constructor runs.", "imageData": ""}, {"assignment": 4, "number": 4, "question": "In Java, can a subclass in a different package access a superclass’s protected method?", "options": {"A": "Yes, without any restrictions.", "B": "Yes, but only if they are in the same package.", "C": "No, protected methods are not accessible by subclasses.", "D": "Yes, but only through inheritance (i.e., using super or this, not via an object)"}, "answer": "D", "code": "", "explanation": "", "imageData": ""}, {"assignment": 4, "number": 5, "question": "A package is a collection of:", "options": {"A": "Only classes", "B": "Only interfaces", "C": "editing tools", "D": "classes,methods and interfaces"}, "answer": "D", "code": "", "explanation": "", "imageData": ""}, {"assignment": 4, "number": 6, "question": "Consider the following program. How many errors does this program contain?", "options": {"A": "None", "B": "1", "C": "2", "D": "3"}, "answer": "B", "code": "class Base { public void print() { System.out.println(\"Base class...\"); } }\nclass Derived extends Base { public void print() { System.out.println(\"Derived class...\"); } }\npublic class Main { private static void main (String[] args) { Base b=new Base(); b.print(); Derived d=new Derived(); d.print(); } }", "explanation": "There is one error: main is private instead of public.", "imageData": ""}, {"assignment": 4, "number": 7, "question": "Choose the best option among the following for the code snippet given above.", "options": {"A": "Both pre-increment and post-increment operators becomes pre-increment during print.", "B": "Both pre-increment and post-increment operators becomes post-increment during print.", "C": "Both Main1 and Main2 classes give the same output (but can depend on the compiler).", "D": "Pre-increment and post-increment operators don’t work during print."}, "answer": "C", "code": "// Main1.java\npublic class Main1{ public static void main(String args[]){ int number=10; System.out.println(number++ + ++number); } }\n// Main2.java\npublic class Main2{ public static void main(String args[]){ int number=10; System.out.println(++number + number++); } }", "explanation": "The source states both programs produce 22, but notes that the result can depend on the compiler.", "imageData": ""}, {"assignment": 4, "number": 8, "question": "What is the output of the above Java Code Snippet with protected access modifier?", "options": {"A": "100 marks", "B": "No output", "C": "Compiler error", "D": "None of the above"}, "answer": "A", "code": "package nptel1; public class Teacher { protected void showMarks(){ System.out.println(\"100 Marks\"); } }\npackage nptel2; import nptel1.*; public class Student extends Teacher { void show(){ showMarks(); } public static void main(String[] args){ Student st1=new Student(); st1.show(); } }", "explanation": "Through inheritance, a protected method can be accessed from a subclass in another package.", "imageData": ""}, {"assignment": 4, "number": 9, "question": "Choose the correct syntax of a Java Package below.", "options": {"A": "package PACKAGE_NAME;", "B": "package PACKAGE_NAME.*;", "C": "pkg PACKAGE_NAME;", "D": "pkg PACKAGE_NAME.*;"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 4, "number": 10, "question": "Which of these access specifiers must be used for main() method?", "options": {"A": "private", "B": "public", "C": "protected", "D": "default"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 5, "number": 1, "question": "Which keyword is NOT used by Java during exception handling?", "options": {"A": "try", "B": "catch", "C": "final", "D": "finally"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 5, "number": 2, "question": "What is the purpose of the throws keyword in Java?", "options": {"A": "To declare exceptions that a method can throw", "B": "To throw an exception immediately", "C": "To catch an exception", "D": "It is not a keyword in Java"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 5, "number": 3, "question": "Which of the following is TRUE about interfaces in Java?", "options": {"A": "Interfaces should always be defined as final.", "B": "Interfaces can be instantiated directly.", "C": "Interfaces can extend multip , "question": "What will be the output of the following Java program?", "options": {"A": "Value of x: 10", "B": "Value of x: 0", "C": "Compilation Error", "D": "Runtime Error"}, "answer": "A", "code": "interface A { int x=10; void display(); }\nclass B implements A { public void display(){ System.out.println(\"Value of x: \"+x); } }\npublic class Main { public static void main(String[] args){ B obj=new B(); obj.display(); } }", "explanation": "", "imageData": ""}, {"assignment": 5, "number": 8, "question": "Which keyword is used by Java during exception handling?", "options": {"A": "final", "B": "finally", "C": "caught", "D": "finished"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 5, "number": 9, "question": "A method that potentially generates a checked exception must include this keyword in its method signature:", "options": {"A": "throw", "B": "extend", "C": "throws", "D": "extends"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 5, "number": 10, "question": "Consider the following code. What will be the output of the above code?", "options": {"A": "Got the Test Exception\nInside finally block", "B": "Got the Test Exception", "C": "Inside finally block", "D": "Compiler Error"}, "answer": "A", "code": "class Test extends Exception {}\nclass Main { public static void main(String args[]) { try { throw new Test(); } catch(Test t){ System.out.println(\"Got the Test Exception\"); } finally { System.out.println(\"Inside finally block \"); } } }", "explanation": "", "imageData": ""}, {"assignment": 6, "number": 1, "question": "What is the primary difference between Byte Streams and Character Streams in Java?", "options": {"A": "Byte Streams handle characters, while Character Streams handle bytes.", "B": "Byte Streams are used for binary data, while Character Streams are used for decimal data.", "C": "Character Streams are faster than Byte Streams in all cases.", "D": "Byte Streams are used for binary da "C": "Displays a message dialog", "D": "Creates a JFrame with a JButton labeled \"Click Me\""}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 9, "number": 5, "question": "Consider the following code. What should replace // INSERT CODE HERE to create a JFrame with a JButton labeled \"Click Me\"?", "options": {"A": "frame.add(button);", "B": "frame.insert(button);", "C": "frame.append(button);", "D": "frame.push(button);"}, "answer": "A", "code": "import javax.swing.*;\npublic class FrameExample { public static void main(String[] args){ JFrame frame=new JFrame(\"Demo Frame\"); JButton button=new JButton(\"Click Me\"); // INSERT CODE HERE\n frame.setSize(300,200); frame.setVisible(true); } }", "explanation": "", "imageData": ""}, {"assignment": 9, "number": 6, "question": "Identify and correct the error in the following program: What should the erroneous line (panel.setFlowLayout();) be replaced with?", "options": {"A": "panel.setLayout(new FlowLayout());", "B": "panel.addFlowLayout();", "C": "panel.appendLayout(new FlowLayout());", "D": "panel.setLayout(new FlowLayout());"}, "answer": "D", "code": "import javax.swing.*;\nimport java.awt.*;\npublic class PanelExample { public static void main(String[] args){ JFrame frame=new JFrame(\"Panel Example\"); JPanel panel=new JPanel(); JButton button=new JButton(\"Submit\"); panel.setFlowLayout(); panel.add(button); frame.add(panel); frame.setSize(300,200); frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE); frame.setVisible(true); } }", "explanation": "", "imageData": ""}, {"assignment": 9, "number": 7, "question": "Which method is used to remove a component from a container in AWT?", "options": {"A": "remove()", "B": "deleteComponent()", "C": "removeComponent()", "D": "destroy()"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 9, "number": 8, "question": "Which method is used to handle mouse click events in Java Swing?", "options": {"A": "mouseClicked()", "B": "keyPressed()", "C": "actionPerformed()", "D": "componentShown()"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 9, "number": 9, "question": "Which Swing component is best suited for displaying a drop-down list of selectable options?", "options": {"A": "JButton", "B": "JComboBox", "C": "JTextField", "D": "JPanel"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 9, "number": 10, "question": "Which of the following function is used to specify the layout of a container?", "options": {"A": "useLayout()", "B": "setLayout()", "C": "layout()", "D": "DesignLayout()"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 1, "question": "Which Swing component is used to display a window?", "options": {"A": "JFrame", "B": "JButton", "C": "JLabel", "D": "JTextField"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 2, "question": "Which Swing component is used to enter a single line of text?", "options": {"A": "JButton", "B": "JLabel", "C": "JTextField", "D": "JPanel"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 3, "question": "Which Swing component is commonly used to display non-editable text?", "options": {"A": "JLabel", "B": "JButton", "C": "JFrame", "D": "JTextField"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 4, "question": "Which JDBC interface is used to execute SQL statements?", "options": {"A": "ResultSet", "B": "Statement", "C": "Connection", "D": "DriverManager"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 5, "question": "Which JDBC object contains the result of a SELECT query?", "options": {"A": "Connection", "B": "Statement", "C": "ResultSet", "D": "DriverManager"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 6, "question": "Which JDBC class is used to establish a database connection?", "options": {"A": "DriverManager", "B": "ResultSet", "C": "Statement", "D": "Scanner"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 7, "question": "Which Java class is used to connect a client to a server?", "options": {"A": "ServerSocket", "B": "Socket", "C": "URL", "D": "NetworkInterface"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 8, "question": "Which class is used by a server to listen for client connections?", "options": {"A": "Socket", "B": "URL", "C": "ServerSocket", "D": "NetworkInterface"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 9, "question": "Which protocol is used in the URL https://nptel.ac.in?", "options": {"A": "FTP", "B": "HTTP", "C": "HTTPS", "D": "SMTP"}, "answer": "C", "code": "", "explanation": "", "imageData": ""}, {"assignment": 10, "number": 10, "question": "Which method of NetworkInterface is used to check whether a network interface is up?", "options": {"A": "isActive()", "B": "isUp()", "C": "isRunning()", "D": "isConnected()"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 11, "number": 1, "question": "How do you establish a connection to a database using JDBC?", "options": {"A": "By creating an instance of the Connection interface", "B": "By using the DriverManager.getConnection() method", "C": "By implementing the Connection interface", "D": "By extending the Connection class"}, "answer": "B", "code": "", "explanation": "", "imageData": ""}, {"assignment": 11, "number": 2, "question": "Which method executes a simple query and returns a single Result Set object?", "options": {"A": "executeQuery()", "B": "executeUpdate()", "C": "execute()", "D": "run()"}, "answer": "A", "code": "", "explanation": "", "imageData": ""}, {"assignment": 11, "number": 3, "question": "Which of the following e const TOTAL=QUESTIONS.length, TIME_LIMIT=90*60, KEY='javaDrillLabStateV2';
let state={screen:'home',mode:'all',assignment:1,randomCount:20,instant:false,quiz:[],index:0,answers:{},visited:{},review:{},startedAt:null,remaining:TIME_LIMIT,submitted:false,sidebar:true,wrongOnly:false};
let timerId=null;
const $=s=>document.querySelector(s);
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function highlightJava(src){let out='';let i=0;const kw=new Set('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record sealed permits non-sealed'.split(' '));const types=new Set('String System Thread Exception RuntimeException ArithmeticException JFrame JButton JPanel JLabel JTextField JComboBox Scanner File FileReader BufferedReader Connection DriverManager ResultSet Statement'.split(' '));while(i<src.length){let c=src[i];if(c==='/'&&src[i+1]==='/'){let j=src.indexOf('\n',i);if(j<0)j=src.length;out+='<span class="com">'+escapeHTML(src.slice(i,j))+'</span>';i=j;continue}if(c==='/'&&src[i+1]==='*'){let j=src.indexOf('*/',i+2);j=j<0?src.length-2:j;let e=j+2;out+='<span class="com">'+escapeHTML(src.slice(i,e))+'</span>';i=e;continue}if(c==='"'||c==="'"){let q=c,j=i+1;while(j<src.length){if(src[j]==='\\'){j+=2;continue}if(src[j]===q){j++;break}j++}out+='<span class="str">'+escapeHTML(src.slice(i,j))+'</span>';i=j;continue}if(/[A-Za-z_$]/.test(c)){let j=i+1;while(j<src.length&&/[A-Za-z0-9_$]/.test(src[j]))j++;let w=src.slice(i,j);let cls=kw.has(w)?'kw':types.has(w)?'type':(j<src.length&&src[j]==='('?'meth':'');out+=cls?'<span class="'+cls+'">'+escapeHTML(w)+'</span>':escapeHTML(w);i=j;continue}if(/[0-9]/.test(c)){let j=i+1;while(j<src.length&&/[A-Za-z0-9._]/.test(src[j]))j++;out+='<span class="num">'+escapeHTML(src.slice(i,j))+'</span>';i=j;continue}out+=escapeHTML(c);i++}return out}
function stateName(id){if(state.answers[id]&&state.review[id])return'both';if(state.review[id])return'marked';if(state.answers[id])return'attempted';if(state.visited[id])return'visited';return'not'}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.screen==='quiz'&&!x.submitted){state=x; if(!state.quiz?.length)state.screen='home';}}catch(e){}}
function clearSaved(){try{localStorage.removeItem(KEY)}catch(e){}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function makeQuiz(){let pool=[...QUESTIONS];if(state.mode==='assignment')pool=pool.filter(q=>q.assignment===Number(state.assignment));else if(state.mode==='random')pool=shuffle(pool).slice(0,Math.max(1,Math.min(TOTAL,Number(state.randomCount)||20)));else if(state.mode==='mix')pool=shuffle(pool);else if(state.mode==='wrong'){pool=state.quiz.map(id=>QUESTIONS.find(q=>q.assignment*100+q.number===id)).filter(Boolean)}return pool.map(q=>q.assignment*100+q.number)}
function startQuiz(){state.quiz=makeQuiz();state.index=0;state.answers={};state.visited={};state.review={};state.startedAt=Date.now();state.remaining=TIME_LIMIT;state.submitted=false;state.sidebar=true;state.screen='quiz';state.wrongOnly=state.mode==='wrong';persist();startTimer();render()}
function startTimer(){if(timerId)clearInterval(timerId);timerId=setInterval(()=>{if(state.screen!=='quiz'){clearInterval(timerId);timerId=null;return}const elapsed=Math.floor((Date.now()-state.startedAt)/1000);state.remaining=Math.max(0,TIME_LIMIT-elapsed);updateTimer();if(state.remaining===0){clearInterval(timerId);timerId=null;submitQuiz(true)}},1000)}
function updateTimer(){const e=$('#timer');if(!e)return;const m=Math.floor(state.remaining/60),s=state.remaining%60;e.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');e.className='timer '+(state.remaining<60?'danger':state.remaining<600?'warn':'')}
function currentQ(){return QUESTIONS.find(q=>q.assignment*100+q.number===state.quiz[state.index])}
function markVisited(){const q=currentQ();if(q)state.visited[q.assignment*100+q.number]=true}
function selectAnswer(letter){const q=currentQ();if(!q||state.submitted)return;state.answers[q.assignment*100+q.number]=letter;persist();render(true)}
function toggleReview(){const q=currentQ();if(!q)return;const id=q.assignment*100+q.number;state.review[id]=!state.review[id];persist();render(true)}
function go(i){if(i<0||i>=state.quiz.length)return;state.index=i;markVisited();persist();render(false)}
function submitQuiz(auto=false){if(state.screen!=='quiz')return;if(timerId){clearInterval(timerId);timerId=null}state.submitted=true;state.screen='result';persist();render()}
function counts(){let c={not:0,visited:0,attempted:0,marked:0,both:0};for(const id of state.quiz){const s=stateName(id);if(s==='both')c.both++;else if(s==='marked')c.marked++;else if(s==='attempted')c.attempted++;else if(s==='visited')c.visited++;else c.not++}return c}
function optionHTML(q){return Object.entries(q.options).map(([k,v])=>`<button type="button" class="option ${state.answers[q.assignment*100+q.number]===k?'selected':''}" data-action="answer" data-letter="${k}"><span class="letter">${k}</span><span>${escapeHTML(v)}</span></button>`).join('')}
function questionHTML(q){const id=q.assignment*100+q.number;let instant='';if(state.instant&&state.answers[id]){const ok=state.answers[id]===q.answer;instant=`<div class="instant ${ok?'correct':'wrong'}"><strong>${ok?'✓ Correct':'✗ Incorrect'}</strong><div><b>Correct answer:</b> ${q.answer}. ${escapeHTML(q.options[q.answer])}</div>${q.explanation?`<div style="margin-top:8px"><b>Explanation:</b> ${escapeHTML(q.explanation)}</div>`:''}</div>`}return `<div class="q-meta">Assignment ${String(q.assignment).padStart(2,'0')} · Question ${q.number}</div><article class="q-card"><div class="q-text">${escapeHTML(q.question)}</div>${q.imageData?`<img loading="lazy" src="${q.imageData}" alt="Relevant question diagram" style="max-width:100%;display:block;margin:20px auto;border:1px solid var(--border);border-radius:10px">`:''}${q.code?`<div class="code-wrap"><div class="code-head"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:6px">Java</span></div><pre class="code">${highlightJava(q.code)}</pre></div>`:''}<div class="options">${optionHTML(q)}</div><button type="button" class="review ${state.review[id]?'marked':''}" data-action="review">${state.review[id]?'★ Marked for Review':'☆ Mark for Review'}</button>${instant}</article>`}
function renderHome(){return `<header class="topbar"><div class="brand">Java <span>Drill Lab</span></div><div class="developer">Developer & Contributor: Beeru Gupta</div></header><main class="screen"><section class="hero"><div class="eyebrow">Java MCQ Practice</div><h1>Java Drill Lab</h1><p>Focused practice from the uploaded Java Programming assignment bank.</p><div class="stats"><div class="stat"><b>120</b><span>Questions</span></div><div class="stat"><b>12</b><span>Assignments</span></div><div class="stat"><b>90 min</b><span>Quiz timer</span></div></div><div class="setup"><div class="section-title">Mode</div><div class="mode-grid">${[['all','All Questions','All 120 questions'],['assignment','One Assignment','Choose one assignment'],['mix','Mix Bag','Mixed assignment order'],['random','Random','Choose question count'],['wrong','Wrong Questions','Retry wrong answers']].map(([v,t,s])=>`<button type="button" class="mode-btn ${state.mode===v?'active':''}" data-action="mode" data-mode="${v}"><b>${t}</b><small>${s}</small></button>`).join('')}</div><div class="config">${state.mode==='assignment'?`<div class="field"><label>Assignment</label><select id="assignment">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${state.assignment===i+1?'selected':''}>Assignment ${String(i+1).padStart(2,'0')}</option>`).join('')}</select></div>`:''}${state.mode==='random'?`<div class="field"><label>Number of questions</label><input id="randomCount" type="number" min="1" max="120" value="${state.randomCount}"></div>`:''}${state.mode==='wrong'?`<div class="field"><label>Wrong Questions</label><div style="color:var(--muted)">${state.quiz?.length||0} questions from the last completed quiz.</div></div>`:''}<div class="field"><label>Instant Result</label><div class="toggle"><input id="instant" type="checkbox" ${state.instant?'checked':''}><span>Show answer and explanation immediately after selection</span></div><div class="hint">OFF: reveal only after submission. ON: show feedback immediately.</div></div></div><button type="button" class="primary" data-action="start">START QUIZ</button>${state.mode==='wrong'&&!state.quiz.length?'<div class="hint">Complete a quiz first to unlock Wrong Questions.</div>':''}</div></section></main>`}
function setMode(v){state.mode=v;persist();render()}
function renderQuiz(){markVisited();const q=currentQ(),c=counts();const side=`<aside class="sidebar ${state.sidebar?'':'collapsed'}">${state.sidebar?`<div class="side-inner"><div class="side-title"><b>Question Navigator</b><button type="button" class="collapse-btn" data-action="sidebar" aria-label="Collapse question navigator">−</button></div><div class="legend"><div><span class="dot-state"></span>Not visited</div><div><span class="dot-state s-visited"></span>Visited</div><div><span class="dot-state s-attempted"></span>Attempted</div><div><span class="dot-state s-marked"></span>Marked for review</div><div><span class="dot-state s-both"></span>Attempted + review</div></div><div class="counts"><div class="count"><b>${c.not}</b>Not visited</div><div class="count"><b>${c.visited}</b>Visited</div><div class="count"><b>${c.attempted}</b>Attempted</div><div class="count"><b>${c.marked}</b>Marked</div><div class="count"><b>${c.both}</b>Attempted + review</div></div><div class="numbers">${state.quiz.map((id,i)=>{const s=stateName(id);return `<button type="button" class="qn ${s} ${i===state.index?'current':''}" data-action="go" data-index="${i}">${i+1}</button>`}).join('')}</div></div>`:`<button type="button" class="collapse-btn" data-action="sidebar" aria-label="Expand question navigator">+</button>`}</aside>`;return `<header class="topbar"><div class="brand">Java <span>Drill Lab</span></div><div class="developer">${state.wrongOnly?'Wrong Questions Retry':'Practice'} · ${state.quiz.length} questions</div></header><div class="quiz-shell ${state.sidebar?'':'sidebar-collapsed'}"><main class="main"><div class="quiz-header"><div><button type="button" class="secondary" data-action="exit">Exit</button></div><div id="timer" class="timer">90:00</div><div style="font-size:13px;color:var(--muted)">${state.index+1} / ${state.quiz.length}</div></div><div class="quiz-body">${questionHTML(q)}<div class="nav"><button type="button" data-action="go" data-index="${state.index-1}" ${state.index===0?'disabled':''}>← Previous</button><button type="button" data-action="${state.index===state.quiz.length-1?'submit':'next'}">${state.index===state.quiz.length-1?'Finish Quiz':'Next →'}</button></div></div></main>${side}</div>`}
function toggleSidebar(){state.sidebar=!state.sidebar;persist();render(true)}
function confirmExit(){if(confirm('Exit this quiz? Your in-progress quiz will be cleared.')){if(timerId){clearInterval(timerId);timerId=null}state.screen='home';state.quiz=[];state.answers={};state.visited={};state.review={};state.submitted=false;clearSaved();render()}}
function renderResult(){const rows=state.quiz.map(id=>{const q=QUESTIONS.find(x=>x.assignment*100+x.number===id);const a=state.answers[id];return {q,a,correct:a===q.answer}});const correct=rows.filter(x=>x.correct).length,wrong=rows.filter(x=>x.a&& !x.correct).length,un=rows.filter(x=>!x.a).length,percent=(correct/state.quiz.length*100||0).toFixed(1);const wrongRows=rows.filter(x=>!x.correct);return `<header class="topbar"><div class="brand">Java <span>Drill Lab</span></div><div class="developer">Quiz Complete</div></header><main class="result"><div class="eyebrow">Quiz Complete</div><div class="scorebox"><div class="bigscore">${correct} / ${state.quiz.length}</div><div class="percent">${percent}% Accuracy</div></div><div class="result-grid"><div class="result-card"><span>Correct</span><b>${correct}</b></div><div class="result-card"><span>Wrong</span><b>${wrong}</b></div><div class="result-card"><span>Unanswered</span><b>${un}</b></div></div><div class="result-actions"><button type="button" class="primary" style="width:auto;margin:0" data-action="retry" ${wrongRows.length?'':'disabled'}>Retry Wrong Questions</button><button type="button" class="secondary" data-action="restart">Restart Quiz</button><button type="button" class="secondary" data-action="home">Home</button></div><section class="wrong-list"><h2>Wrong Questions</h2>${wrongRows.length?wrongRows.map(({q,a})=>`<article class="wrong-card"><h3>Assignment ${String(q.assignment).padStart(2,'0')} · Question ${q.number}</h3><div>${escapeHTML(q.question)}</div>${q.imageData?`<img loading="lazy" src="${q.imageData}" style="max-width:100%;margin:14px 0;border:1px solid var(--border);border-radius:8px" alt="Relevant question image">`:''}${q.code?`<div class="code-wrap"><div class="code-head">Java</div><pre class="code">${highlightJava(q.code)}</pre></div>`:''}<div class="small"><b>Your answer:</b> ${a?escapeHTML(a+'. '+q.options[a]):'Unanswered'}</div><div class="small"><b>Correct answer:</b> ${q.answer}. ${escapeHTML(q.options[q.answer])}</div>${q.explanation?`<div class="small"><b>Explanation:</b> ${escapeHTML(q.explanation)}</div>`:''}</article>`).join(''):'<div class="result-card">No wrong questions. Excellent.</div>'}</section></main>`}
function retryWrong(){const ids=state.quiz.filter(id=>{const q=QUESTIONS.find(x=>x.assignment*100+x.number===id);return state.answers[id]!==q.answer});if(!ids.length)return;state.quiz=ids;state.index=0;state.answers={};state.visited={};state.review={};state.startedAt=Date.now();state.remaining=TIME_LIMIT;state.submitted=false;state.screen='quiz';state.wrongOnly=true;persist();startTimer();render()}
function restartSame(){const oldMode=state.mode;state.mode=oldMode==='wrong'?'all':oldMode;startQuiz()}
function render(keepScroll){const app=document.getElementById('app');if(state.screen==='home')app.innerHTML=renderHome();else if(state.screen==='quiz'){const m=app.querySelector('.main'),sy=m?m.scrollTop:0,ns=app.querySelector('.side-inner'),ny=ns?ns.scrollTop:0;app.innerHTML=renderQuiz();updateTimer();if(keepScroll){const m2=app.querySelector('.main');if(m2)m2.scrollTop=sy;const n2=app.querySelector('.side-inner');if(n2)n2.scrollTop=ny}}else{app.innerHTML=renderResult();window.scrollTo(0,0)}}
document.addEventListener('click',function(e){
  const b=e.target.closest('button[data-action]');
  if(!b || b.disabled) return;
  const a=b.dataset.action;
  if(a==='mode') return setMode(b.dataset.mode);
  if(a==='start') return startQuiz();
  if(a==='answer') return selectAnswer(b.dataset.letter);
  if(a==='review') return toggleReview();
  if(a==='go') return go(Number(b.dataset.index));
  if(a==='next') return go(state.index+1);
  if(a==='submit') return submitQuiz();
  if(a==='sidebar') return toggleSidebar();
  if(a==='exit') return confirmExit();
  if(a==='retry') return retryWrong();
  if(a==='restart') return restartSame();
  if(a==='home'){ if(timerId){clearInterval(timerId);timerId=null} state.screen='home';state.quiz=[];clearSaved();return render(); }
});

document.addEventListener('change',e=>{if(e.target.id==='assignment')state.assignment=+e.target.value;if(e.target.id==='randomCount')state.randomCount=Math.max(1,Math.min(120,+e.target.value||20));if(e.target.id==='instant')state.instant=e.target.checked;persist()});
